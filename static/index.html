<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>English For Kids</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ["Nunito", "ui-rounded", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="min-h-screen bg-[#fff4df] font-display text-slate-900">
    <main class="mx-auto flex min-h-screen w-full max-w-[560px] flex-col px-4 pb-5 pt-3 sm:max-w-[760px]">
      <header class="relative flex items-start justify-between gap-3 py-2">
        <div class="min-w-0">
          <p class="text-xs font-black uppercase tracking-wide text-pink-600">English For Kids</p>
          <h1 class="truncate text-xl font-black sm:text-2xl">Flashcards phát âm</h1>
        </div>
        <div class="relative flex shrink-0 items-center gap-2">
          <span id="roleBadge" class="rounded-full bg-white px-3 py-2 text-xs font-black shadow-md">Guest</span>
          <button id="authToggleBtn" class="rounded-full bg-slate-900 px-3 py-2 text-xs font-black text-white shadow-md active:scale-95">Đăng nhập</button>

          <section id="authPanel" class="absolute right-0 top-12 z-30 hidden w-[min(92vw,360px)] rounded-[22px] border-4 border-white bg-white/95 p-4 text-left shadow-2xl shadow-orange-200 backdrop-blur">
            <div id="signedOutAuth" class="space-y-3">
              <input id="emailInput" class="w-full rounded-2xl border-4 border-yellow-100 px-4 py-3 font-bold outline-none focus:border-sky-300" type="email" placeholder="Email" autocomplete="email" />
              <input id="passwordInput" class="w-full rounded-2xl border-4 border-yellow-100 px-4 py-3 font-bold outline-none focus:border-sky-300" type="password" placeholder="Mật khẩu" autocomplete="current-password" />
              <div class="grid grid-cols-3 gap-2">
                <button id="loginBtn" class="rounded-2xl bg-emerald-500 px-3 py-3 text-sm font-black text-white active:scale-95">Vào</button>
                <button id="signupBtn" class="rounded-2xl bg-sky-500 px-3 py-3 text-sm font-black text-white active:scale-95">Tạo</button>
                <button id="googleBtn" class="rounded-2xl bg-white px-3 py-3 text-sm font-black text-slate-900 shadow active:scale-95">Google</button>
              </div>
            </div>
            <div id="signedInAuth" class="hidden space-y-3">
              <div class="min-w-0">
                <p class="text-xs font-black uppercase text-slate-500">Đang đăng nhập</p>
                <p id="userEmailText" class="truncate font-black"></p>
              </div>
              <button id="logoutBtn" class="w-full rounded-2xl bg-slate-900 px-4 py-3 text-sm font-black text-white active:scale-95">Đăng xuất</button>
            </div>
            <p id="authStatus" class="mt-3 text-center text-sm font-extrabold text-slate-500"></p>
          </section>
        </div>
      </header>

      <section id="accessNote" class="mb-3 rounded-2xl bg-yellow-100 px-4 py-3 text-center text-sm font-black text-yellow-900"></section>

      <section class="grid gap-3 sm:grid-cols-[1fr_180px] sm:items-end">
        <label class="block">
          <span class="text-xs font-black uppercase text-slate-500">Tìm từ</span>
          <input id="searchInput" class="mt-1 w-full rounded-2xl border-4 border-white bg-white px-4 py-3 text-base font-extrabold shadow-md outline-none focus:border-sky-300" placeholder="dog, apple, happy..." />
        </label>
        <label class="block">
          <span class="text-xs font-black uppercase text-slate-500">Chủ đề</span>
          <select id="categorySelect" class="mt-1 w-full rounded-2xl border-4 border-white bg-white px-4 py-3 text-base font-extrabold shadow-md outline-none focus:border-sky-300"></select>
        </label>
      </section>

      <section class="relative mt-4 flex flex-1 items-center justify-center">
        <article id="flashCard" class="flash-card relative flex min-h-[58vh] w-full touch-pan-y select-none flex-col overflow-hidden rounded-[34px] border-4 border-white bg-white p-4 shadow-2xl shadow-orange-100 sm:min-h-[620px] sm:p-6">
          <div class="absolute -right-16 -top-20 h-44 w-44 rounded-full bg-yellow-200"></div>
          <div class="absolute -bottom-20 -left-16 h-52 w-52 rounded-full bg-sky-200"></div>

          <div class="relative flex items-center justify-between gap-2">
            <span id="wordCategory" class="rounded-full bg-pink-100 px-3 py-2 text-xs font-black uppercase text-pink-700">Common Words</span>
            <div class="rounded-full bg-white px-3 py-2 text-sm font-black shadow-md">
              <span id="positionText">1</span>/<span id="totalWords">0</span>
            </div>
          </div>

          <button id="speakArea" class="relative mt-4 flex flex-1 flex-col items-center justify-center rounded-[28px] bg-[#f7fbff] p-4 active:scale-[0.99]" aria-label="Bấm để nghe phát âm">
            <div id="imageFrame" class="grid aspect-square w-full max-w-[320px] place-items-center overflow-hidden rounded-[28px] border-4 border-white text-8xl shadow-xl sm:max-w-[380px]"></div>
            <h2 id="wordText" class="mt-5 max-w-full break-words text-center text-5xl font-black leading-none sm:text-7xl">hello</h2>
            <p id="wordMeaning" class="mt-2 text-center text-base font-extrabold text-slate-500 sm:text-lg">từ thông dụng</p>
            <p id="speechHint" class="mt-4 rounded-full bg-emerald-100 px-4 py-2 text-sm font-black text-emerald-800">Bấm thẻ để nghe</p>
          </button>

          <div class="relative mt-4 grid grid-cols-3 gap-2">
            <button id="prevBtn" class="rounded-2xl bg-sky-500 py-3 text-sm font-black text-white shadow-lg shadow-sky-200 active:scale-95">Trước</button>
            <button id="nextBtn" class="rounded-2xl bg-lime-500 py-3 text-sm font-black text-white shadow-lg shadow-lime-200 active:scale-95">Tiếp</button>
            <button id="randomBtn" class="rounded-2xl bg-violet-500 py-3 text-sm font-black text-white shadow-lg shadow-violet-200 active:scale-95">Đổi</button>
          </div>
        </article>
      </section>

      <section id="adminTools" class="mt-4 hidden rounded-[26px] border-4 border-white bg-white/90 p-4 shadow-xl shadow-orange-100">
        <button id="toggleAdminTools" class="flex w-full items-center justify-between text-left font-black">
          <span>Admin: sửa nội dung và ảnh</span>
          <span id="adminToolsIcon">+</span>
        </button>
        <div id="adminPanel" class="mt-4 hidden space-y-4">
          <div class="rounded-3xl bg-yellow-50 p-4">
            <p class="mb-3 text-sm font-black uppercase text-yellow-800">Giọng đọc</p>
            <div class="grid gap-4 sm:grid-cols-2">
              <label class="block">
                <span class="flex items-center justify-between text-sm font-black text-slate-600">
                  <span>Tốc độ</span>
                  <span id="speechRateValue">0.65x</span>
                </span>
                <input id="speechRateInput" class="mt-2 w-full accent-pink-500" type="range" min="0.45" max="1.05" step="0.05" value="0.65" />
              </label>
              <label class="block">
                <span class="flex items-center justify-between text-sm font-black text-slate-600">
                  <span>Âm lượng</span>
                  <span id="speechVolumeValue">100%</span>
                </span>
                <input id="speechVolumeInput" class="mt-2 w-full accent-sky-500" type="range" min="0.2" max="1" step="0.05" value="1" />
              </label>
            </div>
            <button id="saveSpeechSettingsBtn" class="mt-3 w-full rounded-2xl bg-pink-500 px-3 py-3 text-sm font-black text-white active:scale-95">Lưu giọng đọc</button>
          </div>

          <div class="grid gap-2 sm:grid-cols-2">
            <input id="editWordInput" class="rounded-2xl border-4 border-yellow-100 px-4 py-3 font-bold outline-none focus:border-sky-300" placeholder="Word" />
            <input id="editCategoryInput" class="rounded-2xl border-4 border-yellow-100 px-4 py-3 font-bold outline-none focus:border-sky-300" placeholder="Category" />
            <input id="editMeaningInput" class="rounded-2xl border-4 border-yellow-100 px-4 py-3 font-bold outline-none focus:border-sky-300" placeholder="Meaning" />
            <input id="editEmojiInput" class="rounded-2xl border-4 border-yellow-100 px-4 py-3 font-bold outline-none focus:border-sky-300" placeholder="Emoji" />
            <input id="editColorInput" class="rounded-2xl border-4 border-yellow-100 px-4 py-3 font-bold outline-none focus:border-sky-300" type="color" value="#ffd166" />
            <input id="imageUrlInput" class="rounded-2xl border-4 border-yellow-100 px-4 py-3 font-bold outline-none focus:border-sky-300" placeholder="Image URL" />
          </div>
          <div class="grid grid-cols-2 gap-2 sm:grid-cols-4">
            <button id="saveWordBtn" class="rounded-2xl bg-emerald-500 px-3 py-3 text-sm font-black text-white active:scale-95">Lưu từ</button>
            <button id="saveImageUrlBtn" class="rounded-2xl bg-sky-500 px-3 py-3 text-sm font-black text-white active:scale-95">Lưu ảnh</button>
            <a id="googleImageLink" class="rounded-2xl bg-blue-500 px-3 py-3 text-center text-sm font-black text-white active:scale-95" target="_blank" rel="noreferrer">Tìm ảnh</a>
            <button id="deleteWordBtn" class="rounded-2xl bg-red-500 px-3 py-3 text-sm font-black text-white active:scale-95">Xóa từ</button>
          </div>
          <label class="block rounded-2xl border-4 border-dashed border-pink-200 bg-pink-50 p-3 text-center text-sm font-black text-pink-700">
            Upload ảnh 700x700 lên Supabase
            <input id="imageFileInput" class="hidden" type="file" accept="image/*" />
          </label>
          <div class="grid gap-2 border-t-4 border-yellow-100 pt-4 sm:grid-cols-2">
            <input id="newWordInput" class="rounded-2xl border-4 border-yellow-100 px-4 py-3 font-bold outline-none focus:border-sky-300" placeholder="Từ mới" />
            <input id="newCategoryInput" class="rounded-2xl border-4 border-yellow-100 px-4 py-3 font-bold outline-none focus:border-sky-300" placeholder="Category" />
            <input id="newMeaningInput" class="rounded-2xl border-4 border-yellow-100 px-4 py-3 font-bold outline-none focus:border-sky-300" placeholder="Meaning" />
            <input id="newEmojiInput" class="rounded-2xl border-4 border-yellow-100 px-4 py-3 font-bold outline-none focus:border-sky-300" placeholder="Emoji" />
            <input id="newColorInput" class="rounded-2xl border-4 border-yellow-100 px-4 py-3 font-bold outline-none focus:border-sky-300" type="color" value="#ffd166" />
            <button id="addWordBtn" class="rounded-2xl bg-violet-500 px-3 py-3 text-sm font-black text-white active:scale-95">Thêm từ</button>
          </div>
          <p id="imageStatus" class="text-center text-sm font-extrabold text-slate-500"></p>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
